name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate schemas and generated assets
        run: npm run test

      - name: Run self-tests
        run: npm run selftest

      - name: Build extension
        run: npm run build
