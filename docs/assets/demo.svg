<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-labelledby="t">
  <title id="t">You pause while writing a prompt, and Cognis offers a short opener you finish yourself.</title>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @keyframes type {
      0%, 2%    { width: 0px; }
      26%, 84%  { width: 226px; }
      93%, 100% { width: 0px; }
    }
    @keyframes caret {
      0%, 2%    { transform: translateX(0px); }
      26%, 84%  { transform: translateX(226px); }
      93%, 100% { transform: translateX(0px); }
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes ghost {
      0%, 34%   { opacity: 0; }
      43%, 82%  { opacity: 1; }
      89%, 100% { opacity: 0; }
    }
    @keyframes hint {
      0%, 28%   { opacity: 0; }
      36%, 82%  { opacity: 1; }
      89%, 100% { opacity: 0; }
    }
    #reveal   { animation: type 9s steps(26, end) infinite; }
    #caretbox { animation: caret 9s steps(26, end) infinite; }
    #caret    { animation: blink 1s steps(1, end) infinite; }
    #ghost    { animation: ghost 9s ease infinite; }
    #hint     { animation: hint 9s ease infinite; }
  </style>

  <rect width="720" height="250" rx="12" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="719" height="249" rx="12" fill="none" stroke="#21262d"/>

  <circle cx="34" cy="32" r="5" fill="#30363d"/>
  <circle cx="52" cy="32" r="5" fill="#30363d"/>
  <circle cx="70" cy="32" r="5" fill="#30363d"/>
  <text x="90" y="36" class="mono" font-size="12" fill="#6e7681">claude.ai</text>

  <rect x="28" y="60" width="664" height="124" rx="8" fill="#161b22" stroke="#21262d"/>

  <clipPath id="clip"><rect id="reveal" x="52" y="86" width="0" height="26"/></clipPath>
  <text x="52" y="106" class="mono" font-size="15" fill="#e6edf3" clip-path="url(#clip)">make this function faster</text>
  <g id="caretbox"><rect id="caret" x="53" y="90" width="8" height="18" fill="#58a6ff"/></g>

  <g id="ghost">
    <rect x="52" y="126" width="2" height="20" fill="#58a6ff"/>
    <text x="66" y="142" class="mono" font-size="14" fill="#6e7681" font-style="italic">the constraint that actually matters here is</text>
  </g>

  <text id="hint" x="52" y="170" class="mono" font-size="11" fill="#484f58">an opener you finish yourself, never an autocomplete</text>

  <text x="28" y="218" class="mono" font-size="12" fill="#6e7681">you pause  <tspan fill="#30363d">·</tspan>  cognis offers a stem  <tspan fill="#30363d">·</tspan>  you write the thought</text>
  <text x="28" y="238" class="mono" font-size="11" fill="#484f58">runs locally. no server, no network calls.</text>
</svg>
